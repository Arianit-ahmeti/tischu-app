stages:
  - lint
  - test

prettier:
  stage: lint
  image: node:25-alpine
  cache:
    paths:
      - node_modules/
  before_script:
    - npm install
  script:
    - npm ci
    - npx prettier-formatter-gitlab 'prettier -l ./'
  artifacts:
    reports:
      codequality: gl-prettier-report.json
  allow_failure: false

test:
  stage: test
  image: node:25-alpine
  cache:
    paths:
      - node_modules/
  before_script:
    - npm install
  script:
    - npm test

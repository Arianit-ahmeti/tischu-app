stages:
  - lint
  - test

prettier:
  stage: lint
  image: node:25-alpine
  cache:
    paths:
      - node_modules/
  before_script:
    - npm install --legacy-peer-deps
  script:
    - npm run prettier:check
  allow_failure: false

test:
  stage: test
  image: node:25-alpine
  cache:
    paths:
      - node_modules/
  before_script:
    - npm install --legacy-peer-deps
  script:
    - npm test
